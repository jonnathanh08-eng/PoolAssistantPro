name: Build PoolAssistant APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p PoolAssistant/PoolAssistant :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PoolAssistant-APK
          path: PoolAssistant/PoolAssistant/app/build/outputs/apk/debug/app-debug.apk
